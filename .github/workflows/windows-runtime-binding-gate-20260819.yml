name: Temporary Windows runtime binding gate 20260819

on:
  push:
    branches:
      - agent/windows-runtime-gate-20260819
    paths:
      - '.github/workflows/windows-runtime-binding-gate-20260819.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/windows-runtime-binding-gate-20260819.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-runtime-binding-gate-20260819
  cancel-in-progress: true

jobs:
  gate:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.400

      - name: Download and verify opaque local-only harness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path run, run/evidence | Out-Null
          dotnet --info | Out-File -Encoding utf8 run/evidence/DOTNET_INFO.txt
          dotnet --list-runtimes | Out-File -Encoding utf8 run/evidence/RUNTIME_LIST.txt
          $runtimeList = Get-Content run/evidence/RUNTIME_LIST.txt -Raw
          if ($runtimeList -notmatch 'Microsoft\.NETCore\.App 10\.0\.11') { throw 'Exact NETCore runtime is missing.' }
          if ($runtimeList -notmatch 'Microsoft\.WindowsDesktop\.App 10\.0\.11') { throw 'Exact WindowsDesktop runtime is missing.' }
          $url = 'https://raw.githubusercontent.com/zerodaybugs/test/agent/windows-runtime-matrix-20260819/tooling/windows-runtime-matrix/payload.b64'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile run/payload.b64
          $raw = (Get-Content run/payload.b64 -Raw) -replace '\s',''
          [IO.File]::WriteAllBytes('run/payload.zip', [Convert]::FromBase64String($raw))
          $payloadHash = (Get-FileHash run/payload.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($payloadHash -ne 'be74e532ac2009f1b1ddec1a30800320210d6790542546eaab70e64205d4a4f7') { throw 'Payload hash mismatch.' }
          Expand-Archive run/payload.zip -DestinationPath run -Force
          Get-ChildItem run/payload -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f ((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()), $_.Name
          } | Out-File -Encoding ascii run/evidence/PAYLOAD_SHA256SUMS.txt

      - name: Execute isolated matrix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location run
          try {
            & dotnet .\payload\RuntimeBindingMatrix.dll
            if ($LASTEXITCODE -ne 0) { throw "Matrix process failed with exit code $LASTEXITCODE" }
          }
          finally {
            Pop-Location
          }
          if (-not (Test-Path run/evidence/RESULT.enc.json)) { throw 'Encrypted result is missing.' }
          if (-not (Test-Path run/evidence/RUNNER_STATUS.json)) { throw 'Runner status is missing.' }
          Get-ChildItem run/evidence -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f ((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()), $_.Name
          } | Out-File -Encoding ascii run/evidence/EVIDENCE_SHA256SUMS.txt

      - name: Upload encrypted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-binding-gate-${{ github.run_id }}
          path: run/evidence
          if-no-files-found: error
          retention-days: 3
