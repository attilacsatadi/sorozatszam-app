# Isolated read-only production-state validation; no transaction is broadcast.
name: temporary-reserve-hyusd-production-binding-20260818

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-reserve-hyusd-production-binding-20260818.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temporary-reserve-hyusd-production-binding-20260818.yml

permissions:
  contents: write

jobs:
  read-only-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FOUNDRY_VERSION: v1.7.1
      FOUNDRY_SHA256: cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b
      RPC_URL: https://base-rpc.publicnode.com
      RTOKEN: 0xCc7FF230365bD730eE4B352cC2492CEdAC49383e
      EXPECTED_MAIN: 0xA582985c68ED30a052Ff0b07D74931140bd5a00F
      EXPECTED_BASKET: 0x9306587db04E35981e57013f6E1D867eCa89e2ec
      EXPECTED_BM: 0xA1E1A94977ec3159DB546bf01d7a8d17DD3EbBeD
      EXPECTED_STRSR: 0x796d2367AF69deB3319B8E10712b8B65957371c3
      COLLATERAL: 0x97F9d5ed17A0C99B279887caD5254d15fb1B619B
      WRAPPER: 0xDB5b8cead52f77De0f6B5255f73F348AAf2CBb8D
      EXPECTED_POOL: 0x7A034374C89C463DD65D8C9BCfe63BcBCED41f4F
      EXPECTED_GAUGE: 0x793F22aB88dC91793E5Ce6ADbd7E733B0BD4733e
      AERO: 0x940181a94A35A4569E4529A3CDfB74e38FD98631
      RESULT_DIR: .research/results/reserve-hyusd-production-binding-20260818
    steps:
      - uses: actions/checkout@v4

      - name: Install and verify Foundry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p foundry-bin
          url="https://github.com/foundry-rs/foundry/releases/download/${FOUNDRY_VERSION}/foundry_${FOUNDRY_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors "$url" -o foundry.tar.gz
          echo "${FOUNDRY_SHA256}  foundry.tar.gz" | sha256sum -c -
          tar -xzf foundry.tar.gz -C foundry-bin
          foundry-bin/cast --version

      - name: Run public-state-only production binding
        shell: bash
        env:
          CAST: ${{ github.workspace }}/foundry-bin/cast
        run: bash .research/tools/reserve_hyusd_binding_20260818.sh

      - name: Seal result
        shell: bash
        run: |
          set -euo pipefail
          tar -czf reserve-hyusd-production-binding-20260818.tar.gz "$RESULT_DIR"
          sha256sum reserve-hyusd-production-binding-20260818.tar.gz > reserve-hyusd-production-binding-20260818.tar.gz.sha256
          for run in 1 2 3; do tar -tzf reserve-hyusd-production-binding-20260818.tar.gz >/dev/null; done

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: reserve-hyusd-production-binding-20260818
          path: |
            reserve-hyusd-production-binding-20260818.tar.gz
            reserve-hyusd-production-binding-20260818.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Persist result on direct push
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_DIR"
          git commit -m 'research: record Reserve hyUSD production binding [skip ci]'
          git push origin HEAD:main
